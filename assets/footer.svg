<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DE2C8"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#E879F9"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
<clipPath id="c"><rect width="800" height="120" rx="26"/></clipPath>
</defs>
<style>
.w1{animation:a 9s linear infinite}.w2{animation:a 14s linear infinite reverse}
@keyframes a{to{transform:translateX(-400px)}}
.t{animation:p 3s ease-in-out infinite}@keyframes p{0%,100%{opacity:.6}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)"><rect width="800" height="120" fill="#050816"/>
<g filter="url(#blur)"><ellipse cx="200" cy="110" rx="220" ry="40" fill="#2DE2C8" opacity=".5"/><ellipse cx="620" cy="110" rx="240" ry="40" fill="#8B5CF6" opacity=".6"/></g>
<path class="w2" d="M0 70 Q100 40 200 70 T400 70 T600 70 T800 70 T1000 70 T1200 70 V120 H0Z" fill="url(#bg)" opacity=".35"/>
<path class="w1" d="M0 85 Q100 60 200 85 T400 85 T600 85 T800 85 T1000 85 T1200 85 V120 H0Z" fill="url(#bg)" opacity=".55"/></g>
<text class="t" x="400" y="52" text-anchor="middle" font-family="'Courier New',monospace" font-size="17" fill="#C7D2FE">&lt;/&gt; terima kasih sudah mampir</text>
</svg>
